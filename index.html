<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>iptv</title>
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="wrap">
    <header>
      <h1>iptv</h1>
      <p class="hint">
        Generates working Xtream Codes IPTV portals. Click <b>Get IPTV</b> to
        find live credentials, then copy them into your favourite IPTV player.
      </p>
    </header>

    <div class="controls">
      <button id="go">
        <span class="ico" data-icon="search"></span>
        Get IPTV
      </button>

      <button id="more" class="secondary" disabled>
        <span class="ico" data-icon="plus"></span>
        Get more
      </button>

      <button id="stop" class="secondary" disabled>
        <span class="ico" data-icon="stop"></span>
        Stop
      </button>

      <button id="clear" class="secondary danger" disabled>
        <span class="ico" data-icon="trash"></span>
        Clear all
      </button>

      <button id="export" class="secondary" disabled>
        <span class="ico" data-icon="download"></span>
        Export JSON
      </button>

      <label
        class="toggle"
        title="Connect to each portal and fetch its category and channel counts (slower)"
      >
        <input type="checkbox" id="opt-counts" checked />
        <span>Get channel count</span>
      </label>
    </div>

    <div id="status" class="status"></div>

    <div id="cards" class="cards"></div>
  </div>

  <script src="js/muffler.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/pasteSh.js"></script>
  <script src="js/verifier.js"></script>
  <script src="js/scraper.js"></script>
</body>
</html>
